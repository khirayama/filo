<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-width: 320px;
      max-width: 420px;
      height: auto;
      min-height: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      color: #1a1a1a;
    }
    #root, .popup-shell { min-height: 0; width: 100%; }
    .popup-shell { display: flex; flex-direction: column; }
    .popup-fixed {
      background: #fff;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .empty-view {
      width: 100%;
      min-height: 220px;
      padding: 24px;
      display: grid;
      align-content: center;
      gap: 12px;
      text-align: center;
    }
    .empty-view h1 { font-size: 22px; }
    .empty-view p { color: #666; font-size: 13px; line-height: 1.5; }
    .primary-action, .list-heading button {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
      font-size: 12px;
      padding: 5px 8px;
    }
    .primary-action, .list-heading button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .secondary-action { background: #fff; border: 1px solid #2563eb; border-radius: 6px; color: #2563eb; cursor: pointer; }
    .secondary-action:hover:not(:disabled) { background: #eff6ff; }
    button:disabled { cursor: default; opacity: .45; }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
    }
    .brand span { font-size: 15px; font-weight: 700; color: #2563eb; }
    .brand small {
      color: #666;
      flex: 1;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .current-page { padding: 18px 16px 16px; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .section-label { color: #6b7280; font-size: 11px; font-weight: 600; letter-spacing: .04em; margin-bottom: 7px; }
    .current-page h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .read-page-button { width: 100%; padding: 10px 12px; font-size: 13px; }
    .read-page-button + .read-page-button { margin-top: 8px; }
    .settings {
      padding: 16px;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      color: #555;
    }
    .setting-row label { width: 50px; flex-shrink: 0; }
    .setting-row input[type=range] { flex: 1; }
    .setting-row select {
      flex: 1;
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      color: #333;
    }
    .setting-row .value { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
    .link-button {
      background: none !important;
      border: none !important;
      color: #2563eb !important;
      cursor: pointer;
      font-size: 11px !important;
      padding: 2px 4px !important;
      white-space: nowrap;
    }
    .reading-list { display: flex; flex-direction: column; min-width: 0; }
    .reading-list > .section-heading { padding: 14px 16px 8px; }
    .reading-list > .section-heading .section-label { margin: 0; }
    .queue-list {
      list-style: none;
      overflow-y: auto;
      max-height: 360px;
      min-height: 0;
    }
    .queue-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #f0f0f0;
      scroll-margin-block: 120px;
    }
    .queue-item-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      text-decoration: none;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .queue-item-title:hover { text-decoration: none; }
    .article-open {
      background: none;
      border: 0;
      cursor: pointer;
      display: block;
      min-width: 0;
      padding: 0;
      text-align: left;
      width: 100%;
    }
    .article-open:disabled { cursor: default; }
    .queue-item-remove {
      align-self: center;
      background: none;
      border: 0;
      color: #6b7280;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 11px;
      padding: 4px 0 4px 8px;
    }
    .queue-item-remove:hover:not(:disabled) { color: #dc2626; }
    .article-meta {
      color: #777;
      display: block;
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-message, .error-message { font-size: 12px; padding: 16px; text-align: center; }
    .status-message { color: #777; }
    .error-message { background: #fef2f2; color: #b91c1c; }
    .sign-out-btn {
      background: none;
      border: none;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      padding: 2px 4px;
    }
    .sign-out-btn:hover { color: #333; }
    .sign-in-container {
      padding: 0 16px 12px;
    }
    .sign-in-prompt {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 8px 16px;
      border-top: 1px solid #e5e5e5;
    }
    .sign-in-link {
      color: #2563eb;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/popup.tsx"></script>
</body>
</html>
