<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    /* Palette and scales mirror apps/web/src/global.css (--fl-*). */
    :root {
      --fl-bg: #ffffff;
      --fl-surface: #ffffff;
      --fl-text: #1d1d1f;
      --fl-border: #d4d4d8;
      --fl-muted-border: #e7e7ea;
      --fl-muted: #6e6e76;
      --fl-danger: #b3261e;
      --fl-danger-bg: #fdecea;
      --fl-accent: #1a56db;
      --fl-primary: #1a56db;
      --fl-on-primary: #ffffff;
      --fl-hover: rgba(0, 0, 0, 0.04);
      --fl-radius-sm: 6px;
      --fl-radius: 8px;
      --fl-control-h: 36px;
      --fl-control-h-sm: 28px;
      --fl-gutter: 16px;
      --fl-font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fl-bg: #16181c;
        --fl-surface: #1f2227;
        --fl-text: #e6e6e8;
        --fl-border: #41454d;
        --fl-muted-border: #2c2f35;
        --fl-muted: #9aa0a8;
        --fl-danger: #ef7b74;
        --fl-danger-bg: #3a1f1e;
        --fl-accent: #6a9bff;
        --fl-primary: #3569d6;
        --fl-on-primary: #ffffff;
        --fl-hover: rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }
    }
    :root {
      --fl-accent-soft: color-mix(in srgb, var(--fl-accent) 14%, transparent);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 360px; }
    body {
      background: var(--fl-bg);
      color: var(--fl-text);
      font-family: var(--fl-font);
      font-size: 13px;
      line-height: 1.45;
    }
    button, select, input { color: inherit; font: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }

    .empty-view { color: var(--fl-muted); padding: 48px 24px; text-align: center; }
    .section-label { color: var(--fl-muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; margin-bottom: 6px; }

    .popup-header {
      align-items: center;
      border-bottom: 1px solid var(--fl-muted-border);
      display: flex;
      gap: 8px;
      height: 48px;
      padding: 0 8px 0 var(--fl-gutter);
    }
    .brand-mark { border-radius: 5px; flex-shrink: 0; }
    .brand-name { font-size: 15px; font-weight: 700; }
    .header-spacer { flex: 1; }
    .text-button {
      align-items: center;
      border-radius: var(--fl-radius-sm);
      color: var(--fl-accent);
      display: inline-flex;
      font-size: 12px;
      gap: 4px;
      height: var(--fl-control-h-sm);
      padding: 0 8px;
      white-space: nowrap;
    }
    .text-button:hover:not(:disabled) { background: var(--fl-hover); }

    .button {
      align-items: center;
      background: var(--fl-surface);
      border: 1px solid var(--fl-border);
      border-radius: var(--fl-radius);
      display: inline-flex;
      font-weight: 600;
      gap: 6px;
      height: var(--fl-control-h);
      justify-content: center;
      padding: 0 12px;
    }
    .button:hover:not(:disabled) { background: var(--fl-hover); }
    .button-primary { background: var(--fl-primary); border-color: var(--fl-primary); color: var(--fl-on-primary); }
    .button-primary:hover:not(:disabled) { background: var(--fl-primary); filter: brightness(1.08); }
    .button-small { font-size: 12px; height: var(--fl-control-h-sm); padding: 0 10px; }
    .button-block { width: 100%; }
    .icon-button {
      align-items: center;
      border-radius: var(--fl-radius-sm);
      color: var(--fl-muted);
      display: inline-flex;
      flex-shrink: 0;
      height: 32px;
      justify-content: center;
      width: 32px;
    }
    .icon-button:hover:not(:disabled) { background: var(--fl-hover); color: var(--fl-danger); }

    .auth-panel { border-bottom: 1px solid var(--fl-muted-border); display: grid; gap: 8px; padding: 14px var(--fl-gutter); }
    .auth-panel .section-label { margin: 0; }
    .auth-panel input {
      background: var(--fl-surface);
      border: 1px solid var(--fl-border);
      border-radius: var(--fl-radius);
      height: var(--fl-control-h);
      padding: 0 10px;
    }
    .auth-switch { justify-self: center; }

    .mini-player {
      align-items: center;
      border-bottom: 1px solid var(--fl-muted-border);
      color: var(--fl-accent);
      display: flex;
      gap: 8px;
      padding: 6px 8px 6px var(--fl-gutter);
    }
    .mini-player-title { color: var(--fl-text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .reader-panel { border-bottom: 1px solid var(--fl-muted-border); display: grid; gap: 10px; padding: 14px var(--fl-gutter) 16px; }
    .reader-panel .section-label { margin: 0; }
    .page-title {
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      display: -webkit-box;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
    }
    .button-row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .message { color: var(--fl-muted); font-size: 12px; }
    .message-error { background: var(--fl-danger-bg); border-radius: var(--fl-radius-sm); color: var(--fl-danger); padding: 8px 10px; }

    .settings-row { display: flex; gap: 8px; }
    .setting { display: grid; flex: 1; gap: 4px; min-width: 0; }
    .setting-voice { flex: 1.6; }
    .setting-rate { flex: 0.8; }
    .setting span { color: var(--fl-muted); font-size: 11px; font-weight: 600; }
    .setting select {
      background: var(--fl-surface);
      border: 1px solid var(--fl-border);
      border-radius: var(--fl-radius-sm);
      height: var(--fl-control-h-sm);
      min-width: 0;
      padding: 0 4px;
      width: 100%;
    }

    .shortcuts { border-bottom: 1px solid var(--fl-muted-border); padding: 12px var(--fl-gutter); }
    .shortcuts ul { display: grid; gap: 2px; list-style: none; }
    .shortcuts li { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre; }

    .list-heading { padding: 12px var(--fl-gutter) 0; }
    .reading-list > .message { padding: 8px var(--fl-gutter) 16px; }
    .list { list-style: none; max-height: 320px; overflow-y: auto; }
    .list-row {
      align-items: center;
      border-bottom: 1px solid var(--fl-muted-border);
      display: flex;
      gap: 4px;
      padding: 0 4px 0 var(--fl-gutter);
      position: relative;
    }
    .list-row:hover { background: var(--fl-hover); }
    .list-row-current { background: var(--fl-accent-soft); }
    .list-row-current::before { background: var(--fl-accent); bottom: 0; content: ""; left: 0; position: absolute; top: 0; width: 3px; }
    .list-row-main { display: grid; flex: 1; gap: 2px; min-width: 0; padding: 10px 0; text-align: left; }
    .list-row-title {
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      display: -webkit-box;
      overflow: hidden;
    }
    .list-row-current .list-row-title { font-weight: 600; }
    .list-row-meta { color: var(--fl-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/popup.tsx"></script>
</body>
</html>
