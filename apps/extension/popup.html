<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 400px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      color: #1a1a1a;
    }
    .top { padding: 12px 16px 0; flex-shrink: 0; }
    .title-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .lang-badge {
      font-size: 11px;
      color: #555;
      background: #f0f0f0;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .progress-bar {
      height: 3px;
      background: #e5e5e5;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .controls button {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 13px;
      color: #333;
    }
    .controls button:hover:not(:disabled) { background: #f3f4f6; }
    .controls button:disabled { opacity: 0.4; cursor: default; }
    .controls button.primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .controls button.primary:hover:not(:disabled) { background: #1d4ed8; }
    .settings {
      border-top: 1px solid #e5e5e5;
      padding: 8px 16px 12px;
      flex-shrink: 0;
    }
    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      color: #555;
    }
    .setting-row label { width: 50px; flex-shrink: 0; }
    .setting-row input[type=range] { flex: 1; }
    .setting-row select {
      flex: 1;
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      color: #333;
    }
    .setting-row .value { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e5e5;
    }
    .brand span { font-size: 15px; font-weight: 700; color: #2563eb; }
    .queue-count {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
    .now-playing {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 8px;
      min-width: 0;
    }
    .now-playing-label {
      flex-shrink: 0;
      font-size: 11px;
      color: #2563eb;
      background: #eff6ff;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .now-playing-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .queue-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .queue-item.playing { background: #eff6ff; }
    .queue-item-body { flex: 1; min-width: 0; }
    .queue-item-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      text-decoration: none;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .queue-item-title:hover { text-decoration: underline; }
    .queue-item-url {
      display: block;
      font-size: 11px;
      color: #2563eb;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .queue-item-url:hover { text-decoration: underline; }
    .queue-item-remove {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #999;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }
    .queue-item-remove:hover { color: #dc2626; }
    .sign-out-btn {
      background: none;
      border: none;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      padding: 2px 4px;
    }
    .sign-out-btn:hover { color: #333; }
    .sign-in-container {
      padding: 0 16px 12px;
    }
    .sign-in-prompt {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 8px 16px;
      border-top: 1px solid #e5e5e5;
    }
    .sign-in-link {
      color: #2563eb;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/popup.tsx"></script>
</body>
</html>
