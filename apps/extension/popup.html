<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100%;
      min-width: 320px;
      height: 100vh;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      color: #1a1a1a;
    }
    #root, .popup-shell { min-height: 0; height: 100%; }
    .popup-shell { display: flex; flex-direction: column; }
    .empty-view {
      width: 100%;
      min-height: 220px;
      padding: 24px;
      display: grid;
      align-content: center;
      gap: 12px;
      text-align: center;
    }
    .empty-view h1 { font-size: 22px; }
    .empty-view p { color: #666; font-size: 13px; line-height: 1.5; }
    .primary-action, .list-heading button {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
      font-size: 12px;
      padding: 5px 8px;
    }
    .primary-action, .list-heading button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button:disabled { cursor: default; opacity: .45; }
    .top { padding: 12px 16px 0; flex-shrink: 0; }
    .title-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .lang-badge {
      font-size: 11px;
      color: #555;
      background: #f0f0f0;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .progress-bar {
      height: 3px;
      background: #e5e5e5;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #2563eb;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .controls button {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 13px;
      color: #333;
    }
    .controls button.transport {
      align-items: center;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 50%;
      display: flex;
      font-size: 16px;
      height: 42px;
      justify-content: center;
      padding: 0;
      width: 42px;
    }
    .controls button.transport.primary {
      background: #2563eb;
      border-color: #2563eb;
      box-shadow: 0 5px 12px #2563eb3d;
      font-size: 19px;
      height: 54px;
      width: 54px;
    }
    .controls button.transport:hover:not(:disabled) { background: #f3f4f6; transform: translateY(-1px); }
    .controls button.transport.primary:hover:not(:disabled) { background: #1d4ed8; }
    .controls button:hover:not(:disabled) { background: #f3f4f6; }
    .controls button:disabled { opacity: 0.4; cursor: default; }
    .controls button.primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .controls button.primary:hover:not(:disabled) { background: #1d4ed8; }
    .settings {
      border-top: 1px solid #e5e5e5;
      padding: 8px 16px 12px;
      flex-shrink: 0;
    }
    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      color: #555;
    }
    .setting-row label { width: 50px; flex-shrink: 0; }
    .setting-row input[type=range] { flex: 1; }
    .setting-row select {
      flex: 1;
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: #fff;
      color: #333;
    }
    .setting-row .value { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e5e5;
    }
    .brand span { font-size: 15px; font-weight: 700; color: #2563eb; }
    .brand small {
      color: #666;
      flex: 1;
      font-size: 11px;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-button {
      background: none !important;
      border: none !important;
      color: #2563eb !important;
      cursor: pointer;
      font-size: 11px !important;
      padding: 2px 4px !important;
      white-space: nowrap;
    }
    .queue-count {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
    .player-card {
      background: linear-gradient(145deg, #f8fbff, #eef4ff);
      border: 1px solid #dbe7ff;
      border-radius: 14px;
      box-shadow: 0 6px 16px #2563eb12;
      padding: 12px;
    }
    .player-card-header, .player-progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .player-main {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      min-width: 0;
    }
    .player-art {
      align-items: center;
      background: linear-gradient(145deg, #2563eb, #7c3aed);
      border-radius: 10px;
      box-shadow: 0 5px 12px #2563eb3d;
      color: #fff;
      display: flex;
      flex-shrink: 0;
      font-size: 25px;
      height: 52px;
      justify-content: center;
      width: 52px;
    }
    .player-copy { min-width: 0; }
    .now-playing-label {
      align-items: center;
      display: inline-flex;
      flex-shrink: 0;
      font-size: 11px;
      color: #2563eb;
      background: #eff6ff;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .play-indicator {
      background: #9ca3af;
      border-radius: 50%;
      height: 6px;
      margin-right: 5px;
      width: 6px;
    }
    .play-indicator.active {
      background: #2563eb;
      box-shadow: 0 0 0 3px #2563eb22;
    }
    .now-playing-title {
      display: block;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-copy small {
      color: #6b7280;
      display: block;
      font-size: 11px;
      margin-top: 3px;
    }
    .player-progress-meta {
      color: #6b7280;
      font-size: 10px;
      margin-top: 5px;
    }
    .player-progress-meta span:last-child { color: #2563eb; }
    .progress-bar {
      height: 4px;
      background: #dbe3f2;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    .queue-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .queue-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .queue-item.playing { background: #eff6ff; }
    .queue-item-body { flex: 1; min-width: 0; }
    .queue-item-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      text-decoration: none;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .queue-item-title:hover { text-decoration: underline; }
    .queue-item-url {
      display: block;
      font-size: 11px;
      color: #2563eb;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .queue-item-url:hover { text-decoration: underline; }
    .queue-item-remove {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #999;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }
    .queue-item-remove:hover { color: #dc2626; }
    .list-heading {
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
      border-top: 1px solid #e5e5e5;
      display: flex;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px 12px;
    }
    .list-heading button { flex-shrink: 0; }
    .article-open {
      background: none;
      border: none;
      cursor: pointer;
      flex: 1;
      min-width: 0;
      padding: 0;
      text-align: left;
    }
    .article-meta {
      color: #777;
      display: block;
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .article-play {
      align-self: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 50%;
      color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
      height: 28px;
      width: 28px;
    }
    .status-message, .error-message { font-size: 12px; padding: 16px; text-align: center; }
    .status-message { color: #777; }
    .error-message { background: #fef2f2; color: #b91c1c; }
    footer { color: #aaa; flex-shrink: 0; font-size: 10px; padding: 4px 12px; text-align: right; }
    .sign-out-btn {
      background: none;
      border: none;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      padding: 2px 4px;
    }
    .sign-out-btn:hover { color: #333; }
    .sign-in-container {
      padding: 0 16px 12px;
    }
    .sign-in-prompt {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 8px 16px;
      border-top: 1px solid #e5e5e5;
    }
    .sign-in-link {
      color: #2563eb;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/popup.tsx"></script>
</body>
</html>
