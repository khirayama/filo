name: Filo
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.1.3
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0
targets:
  Filo:
    type: application
    platform: iOS
    info:
      path: Filo/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    sources:
      - path: Filo/Sources
      - path: Filo/Resources
        buildPhase: resources
      - path: LocalSecrets.plist
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Filo/Resources/Preview Content\""
        CODE_SIGN_ENTITLEMENTS: Filo/Filo.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.filo.app
        PRODUCT_NAME: Filo
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
    dependencies:
      - target: FiloShare
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    scheme:
      testTargets:
        - FiloTests
  FiloShare:
    type: app-extension
    platform: iOS
    info:
      path: FiloShare/Info.plist
      properties:
        CFBundleDisplayName: FiloShare
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    sources:
      - path: FiloShare
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: FiloShare/FiloShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.filo.app.share
        PRODUCT_NAME: FiloShare
  FiloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Filo/Tests
    dependencies:
      - target: Filo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.filo.appTests
        PRODUCT_NAME: FiloTests
